name: Python API CI — Partial
on:
  push:
    branches: [main]
jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@abc1234def5678901234567890abc1234def56789012
      - name: Secrets scan
        run: gitleaks detect --source . --exit-code 1
      - name: Dependency audit
        run: trivy fs --exit-code 1 .
  build:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@abc1234def5678901234567890abc1234def56789012
      - name: Test and build
        run: |
          pip install -e .
          python -m pytest
          python -m build
      - name: Deploy
        env:
          SERVICE_KEY: EXAMPLE_hardcoded_service_key_mnop123_do_not_use
        run: ./deploy.py
