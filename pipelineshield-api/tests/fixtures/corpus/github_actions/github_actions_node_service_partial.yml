name: Node Service CI — Partial
on:
  push:
    branches: [main]
jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@abc1234def5678901234567890abc1234def56789012
      - name: Secret scan
        run: gitleaks detect --source . --exit-code 1
      - name: SAST
        run: semgrep --config=auto .
  build:
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@abc1234def5678901234567890abc1234def56789012
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Deploy
        env:
          API_SECRET: EXAMPLE_hardcoded_secret_value_pqr456_do_not_use
        run: ./scripts/deploy.sh
