name: Python API CI — Hardened
on:
  push:
    branches: [main]
jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@abc1234def5678901234567890abc1234def56789012
      - name: Secrets scan
        run: gitleaks detect --source . --exit-code 1
      - name: SAST
        run: semgrep --config=auto .
      - name: Dependency scan
        run: trivy fs --exit-code 1 .
      - name: Container image scan
        run: trivy image --exit-code 1 python:3.12-slim
      - name: IaC scan
        run: checkov -d . --quiet
  build-sign:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      id-token: write
      packages: write
    environment: production
    steps:
      - uses: actions/checkout@abc1234def5678901234567890abc1234def56789012
      - name: Configure OIDC credentials
        uses: aws-actions/configure-aws-credentials@111122223333444455556666777788889999000011112222
      - name: Build image
        run: docker build -t python-api:${{ github.sha }} .
      - name: Sign image with cosign
        run: cosign sign --key env://COSIGN_KEY python-api:${{ github.sha }}
      - name: Attest provenance
        run: cosign attest --predicate provenance.json python-api:${{ github.sha }}
      - name: Generate SBOM
        run: syft python-api:${{ github.sha }} -o cyclonedx-json > sbom.json
      - name: Push image
        run: docker push python-api:${{ github.sha }}
