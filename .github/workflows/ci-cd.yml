name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege default token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Backend: Python 3.12 + FastAPI + Postgres + Redis
  # ─────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelineshield-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pipelineshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pipelineshield
      REDIS_URL: redis://localhost:6379
      OIDC_ISSUER: https://example-idp/
      OIDC_CLIENT_ID: dummy
      OIDC_CLIENT_SECRET: dummy
      OIDC_REDIRECT_URI: http://localhost:8000/api/v1/auth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Type check (mypy)
        run: mypy src

      - name: Run tests (fast suite)
        run: pytest --cov --cov-report=xml

      - name: Run detection benchmark
        run: pytest -m benchmark

  # ─────────────────────────────────────────────
  # Frontend: Node 20 + Vite + React
  # ─────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelineshield-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check / lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: pipelineshield-web/dist
          retention-days: 7
