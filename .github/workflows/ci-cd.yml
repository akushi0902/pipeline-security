name: PipelineShield CI/CD

on:
  push:
    branches:
      - "forge/pipeline-shield-ai-ci-cd-secur-d374f19a-run5-51wo"

  pull_request:
    branches:
      - "forge/pipeline-shield-ai-ci-cd-secur-d374f19a-run5-51wo"

permissions:
  contents: read

jobs:

  # ============================================================
  # BACKEND VALIDATION
  # ============================================================

  backend-validation:
    name: Backend - Application Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipelineshield-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify application import
        run: |
          python -c "from pipelineshield.api.main import app; print('APP OK:', app.title)"


  # ============================================================
  # FRONTEND VALIDATION
  # ============================================================

  frontend-build:
    name: Frontend - Build Without Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipelineshield-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only
          test -f package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Remove test files
        shell: bash
        run: |
          echo "Removing frontend test files..."

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete

          echo "Remaining test files:"
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true

      - name: Build frontend
        run: npm run build


  # ============================================================
  # DOCKER IMAGES
  # ============================================================

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-validation
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Node is needed to generate package-lock.json
      # ----------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------------------------------------------
      # Generate package-lock.json
      # ----------------------------------------------------------

      - name: Generate frontend package-lock.json
        working-directory: pipelineshield-web
        run: |
          echo "Generating package-lock.json..."
          npm install --package-lock-only
          test -f package-lock.json
          echo "package-lock.json generated."


      # ----------------------------------------------------------
      # IMPORTANT:
      # Remove frontend tests BEFORE Docker build.
      #
      # Dockerfile runs:
      #   COPY . .
      #   RUN npm run build
      #
      # Therefore tests must be removed from this job,
      # not only from frontend-build.
      # ----------------------------------------------------------

      - name: Remove frontend test files before Docker build
        working-directory: pipelineshield-web
        shell: bash
        run: |
          echo "Test files before removal:"

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true

          echo "Removing test files..."

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete

          echo "Test files after removal:"

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true


      # ----------------------------------------------------------
      # Build backend Docker image
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t pipelineshield-backend:${{ github.sha }} \
            ./pipelineshield-api


      # ----------------------------------------------------------
      # Build frontend Docker image
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t pipelineshield-frontend:${{ github.sha }} \
            ./pipelineshield-web


      # ----------------------------------------------------------
      # Verify Docker images
      # ----------------------------------------------------------

      - name: Verify Docker images
        run: |
          docker images | grep pipelineshield


  # ============================================================
  # KUBERNETES VALIDATION
  # ============================================================

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    needs:
      - build-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate namespace
        run: |
          kubectl apply \
            --dry-run=client \
            -f k8s/namespace.yaml

      - name: Validate backend manifest
        run: |
          kubectl apply \
            --dry-run=client \
            -f k8s/backend.yaml

      - name: Validate frontend manifest
        run: |
          kubectl apply \
            --dry-run=client \
            -f k8s/frontend.yaml


  # ============================================================
  # LOCAL KUBERNETES DEPLOYMENT
  # ============================================================

  deploy-local:
    name: Deploy to Local Kubernetes
    runs-on: ubuntu-latest

    needs:
      - validate-kubernetes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------------------------------------------
      # Generate package-lock.json
      # ----------------------------------------------------------

      - name: Generate frontend package-lock.json
        working-directory: pipelineshield-web
        run: |
          npm install --package-lock-only
          test -f package-lock.json

      # ----------------------------------------------------------
      # Remove tests before Docker build
      # ----------------------------------------------------------

      - name: Remove frontend test files
        working-directory: pipelineshield-web
        shell: bash
        run: |
          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete

      # ----------------------------------------------------------
      # Create Kind cluster
      # ----------------------------------------------------------

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pipelineshield

      # ----------------------------------------------------------
      # Build backend image
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t pipelineshield-backend:local \
            ./pipelineshield-api

      # ----------------------------------------------------------
      # Build frontend image
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t pipelineshield-frontend:local \
            ./pipelineshield-web

      # ----------------------------------------------------------
      # Load backend image into Kind
      # ----------------------------------------------------------

      - name: Load backend image into Kind
        run: |
          kind load docker-image \
            pipelineshield-backend:local \
            --name pipelineshield

      # ----------------------------------------------------------
      # Load frontend image into Kind
      # ----------------------------------------------------------

      - name: Load frontend image into Kind
        run: |
          kind load docker-image \
            pipelineshield-frontend:local \
            --name pipelineshield

      # ----------------------------------------------------------
      # Deploy namespace
      # ----------------------------------------------------------

      - name: Deploy namespace
        run: |
          kubectl apply \
            -f k8s/namespace.yaml

      # ----------------------------------------------------------
      # Deploy backend
      # ----------------------------------------------------------

      - name: Deploy backend
        run: |
          kubectl apply \
            -f k8s/backend.yaml

      # ----------------------------------------------------------
      # Deploy frontend
      # ----------------------------------------------------------

      - name: Deploy frontend
        run: |
          kubectl apply \
            -f k8s/frontend.yaml

      # ----------------------------------------------------------
      # Wait for backend
      # ----------------------------------------------------------

      - name: Wait for backend
        run: |
          kubectl rollout status \
            deployment/pipelineshield-backend \
            -n pipelineshield \
            --timeout=180s

      # ----------------------------------------------------------
      # Wait for frontend
      # ----------------------------------------------------------

      - name: Wait for frontend
        run: |
          kubectl rollout status \
            deployment/pipelineshield-frontend \
            -n pipelineshield \
            --timeout=180s

      # ----------------------------------------------------------
      # Create backend port forward
      # ----------------------------------------------------------

      - name: Create backend port forward
        run: |
          kubectl port-forward \
            svc/pipelineshield-backend \
            8000:8000 \
            -n pipelineshield > /tmp/backend.log 2>&1 &

          sleep 10

      # ----------------------------------------------------------
      # Backend health check
      # ----------------------------------------------------------

      - name: Backend health check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://127.0.0.1:8000/api/docs

      # ----------------------------------------------------------
      # OpenAPI check
      # ----------------------------------------------------------

      - name: API OpenAPI check
        run: |
          curl --fail \
            http://127.0.0.1:8000/openapi.json

      # ----------------------------------------------------------
      # Deployment diagnostics
      # ----------------------------------------------------------

      - name: Deployment status
        if: always()
        run: |
          echo "=== PODS ==="
          kubectl get pods -n pipelineshield

          echo "=== SERVICES ==="
          kubectl get svc -n pipelineshield

          echo "=== BACKEND LOGS ==="
          kubectl logs \
            deployment/pipelineshield-backend \
            -n pipelineshield \
            --tail=100 || true

          echo "=== FRONTEND LOGS ==="
          kubectl logs \
            deployment/pipelineshield-frontend \
            -n pipelineshield \
            --tail=100 || true

          echo "=== BACKEND API ==="
          echo "http://127.0.0.1:8000"

          echo "=== SWAGGER ==="
          echo "http://127.0.0.1:8000/api/docs"
