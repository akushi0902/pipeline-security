name: PipelineShield CI/CD

on:
  push:
    branches:
      - "forge/pipeline-shield-ai-ci-cd-secur-d374f19a-run5-51wo"

  pull_request:
    branches:
      - "forge/pipeline-shield-ai-ci-cd-secur-d374f19a-run5-51wo"

permissions:
  contents: read

jobs:

  # ============================================================
  # BACKEND VALIDATION
  # ============================================================

  backend-validation:
    name: Backend - Application Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipelineshield-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Verify application import
        run: |
          python -c "from pipelineshield.api.main import app; print('APP OK:', app.title)"


  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:
    name: Frontend - Build Without Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: pipelineshield-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pipelineshield-web/package-lock.json

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      # ----------------------------------------------------------
      # Generate package-lock.json
      # ----------------------------------------------------------

      - name: Generate package-lock.json
        run: |
          echo "Generating package-lock.json..."

          npm install --package-lock-only

          echo "Verifying package-lock.json..."

          test -f package-lock.json

          ls -lh package.json package-lock.json

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------

      - name: Install frontend dependencies
        run: |
          npm ci

      # ----------------------------------------------------------
      # Remove frontend tests
      # ----------------------------------------------------------

      - name: Remove frontend test files
        shell: bash
        run: |
          echo "Searching for test files..."

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true

          echo "Removing test files..."

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete

          echo "Remaining test files:"

          find src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true

      # ----------------------------------------------------------
      # Build frontend
      # ----------------------------------------------------------

      - name: Build frontend
        run: |
          npm run build


  # ============================================================
  # DOCKER IMAGES
  # ============================================================

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-validation
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Setup Node
      # ----------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      # ----------------------------------------------------------
      # Generate package-lock.json inside Docker build context
      # ----------------------------------------------------------

      - name: Generate frontend package-lock.json
        working-directory: pipelineshield-web
        run: |
          echo "Generating package-lock.json for Docker build..."

          npm install --package-lock-only

          echo "Verifying package-lock.json..."

          test -f package-lock.json

          ls -lh package.json package-lock.json

      # ----------------------------------------------------------
      # Remove frontend test files from Docker build context
      # ----------------------------------------------------------

      - name: Remove frontend test files
        shell: bash
        run: |
          echo "Removing frontend test files before Docker build..."

          find pipelineshield-web/src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true

          find pipelineshield-web/src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete

          echo "Test files remaining:"

          find pipelineshield-web/src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -print || true

      # ----------------------------------------------------------
      # Verify Docker build context
      # ----------------------------------------------------------

      - name: Verify frontend Docker build context
        run: |
          echo "Frontend package files:"
          ls -lh pipelineshield-web/package.json
          ls -lh pipelineshield-web/package-lock.json

          echo "Frontend source size:"
          du -sh pipelineshield-web

      # ----------------------------------------------------------
      # Build backend image
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t pipelineshield-backend:${{ github.sha }} \
            ./pipelineshield-api

      # ----------------------------------------------------------
      # Build frontend image
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t pipelineshield-frontend:${{ github.sha }} \
            ./pipelineshield-web

      # ----------------------------------------------------------
      # Verify images
      # ----------------------------------------------------------

      - name: Verify Docker images
        run: |
          docker images | grep pipelineshield


  # ============================================================
  # KUBERNETES MANIFEST VALIDATION
  # ============================================================

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    needs:
      - build-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Validate Kubernetes YAML syntax
        shell: bash
        run: |
          python <<'PY'
          import yaml
          from pathlib import Path

          files = [
              "k8s/namespace.yaml",
              "k8s/backend.yaml",
              "k8s/frontend.yaml",
          ]

          failed = False

          for file in files:
              path = Path(file)

              print(f"Validating {file}...")

              if not path.exists():
                  print(f"ERROR: {file} does not exist")
                  failed = True
                  continue

              try:
                  with path.open("r", encoding="utf-8") as f:
                      documents = list(yaml.safe_load_all(f))

                  if not documents:
                      print(f"ERROR: {file} is empty")
                      failed = True
                      continue

                  for index, document in enumerate(documents, start=1):
                      if document is None:
                          print(
                              f"WARNING: {file} document {index} is empty"
                          )

                      elif not isinstance(document, dict):
                          print(
                              f"ERROR: {file} document {index} "
                              "is not a YAML object"
                          )
                          failed = True

                  print(f"OK: {file}")

              except yaml.YAMLError as exc:
                  print(f"ERROR: Invalid YAML in {file}")
                  print(exc)
                  failed = True

          if failed:
              raise SystemExit(1)

          print("All Kubernetes YAML files passed syntax validation.")
          PY


  # ============================================================
  # LOCAL KUBERNETES DEPLOYMENT
  # ============================================================

  deploy-local:
    name: Deploy to Local Kubernetes
    runs-on: ubuntu-latest

    needs:
      - validate-kubernetes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Create real Kubernetes cluster
      # ----------------------------------------------------------

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pipelineshield

      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ----------------------------------------------------------
      # Setup Node
      # ----------------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ----------------------------------------------------------
      # Generate package-lock.json
      # ----------------------------------------------------------

      - name: Generate frontend package-lock.json
        working-directory: pipelineshield-web
        run: |
          npm install --package-lock-only
          test -f package-lock.json

      # ----------------------------------------------------------
      # Remove frontend tests
      # ----------------------------------------------------------

      - name: Remove frontend test files
        shell: bash
        run: |
          find pipelineshield-web/src -type f \( \
            -name "*.test.ts" \
            -o -name "*.test.tsx" \
            -o -name "*.spec.ts" \
            -o -name "*.spec.tsx" \
          \) -delete || true

      # ----------------------------------------------------------
      # Build images
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t pipelineshield-backend:local \
            ./pipelineshield-api

      - name: Build frontend image
        run: |
          docker build \
            -t pipelineshield-frontend:local \
            ./pipelineshield-web

      # ----------------------------------------------------------
      # Load images into Kind
      # ----------------------------------------------------------

      - name: Load backend image into Kind
        run: |
          kind load docker-image \
            pipelineshield-backend:local \
            --name pipelineshield

      - name: Load frontend image into Kind
        run: |
          kind load docker-image \
            pipelineshield-frontend:local \
            --name pipelineshield

      # ----------------------------------------------------------
      # Deploy namespace
      # ----------------------------------------------------------

      - name: Deploy namespace
        run: |
          kubectl apply \
            -f k8s/namespace.yaml

      # ----------------------------------------------------------
      # Deploy backend
      # ----------------------------------------------------------

      - name: Deploy backend
        run: |
          kubectl apply \
            -f k8s/backend.yaml

      # ----------------------------------------------------------
      # Deploy frontend
      # ----------------------------------------------------------

      - name: Deploy frontend
        run: |
          kubectl apply \
            -f k8s/frontend.yaml

      # ----------------------------------------------------------
      # Wait for backend
      # ----------------------------------------------------------

      - name: Wait for backend
        run: |
          kubectl rollout status \
            deployment/pipelineshield-backend \
            -n pipelineshield \
            --timeout=180s

      # ----------------------------------------------------------
      # Wait for frontend
      # ----------------------------------------------------------

      - name: Wait for frontend
        run: |
          kubectl rollout status \
            deployment/pipelineshield-frontend \
            -n pipelineshield \
            --timeout=180s

      # ----------------------------------------------------------
      # Show Kubernetes resources
      # ----------------------------------------------------------

      - name: Show deployment status
        run: |
          echo "=== PODS ==="
          kubectl get pods \
            -n pipelineshield \
            -o wide

          echo "=== SERVICES ==="
          kubectl get svc \
            -n pipelineshield

          echo "=== DEPLOYMENTS ==="
          kubectl get deployments \
            -n pipelineshield

      # ----------------------------------------------------------
      # Backend port forwarding
      # ----------------------------------------------------------

      - name: Create backend port forward
        run: |
          kubectl port-forward \
            svc/pipelineshield-backend \
            8000:8000 \
            -n pipelineshield \
            > /tmp/backend.log 2>&1 &

          sleep 10

      # ----------------------------------------------------------
      # Backend health check
      # ----------------------------------------------------------

      - name: Backend health check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://127.0.0.1:8000/api/docs

      # ----------------------------------------------------------
      # OpenAPI check
      # ----------------------------------------------------------

      - name: API OpenAPI check
        run: |
          curl --fail \
            http://127.0.0.1:8000/openapi.json

      # ----------------------------------------------------------
      # Frontend port forwarding
      # ----------------------------------------------------------

      - name: Create frontend port forward
        run: |
          kubectl port-forward \
            svc/pipelineshield-frontend \
            8080:80 \
            -n pipelineshield \
            > /tmp/frontend.log 2>&1 &

          sleep 10

      # ----------------------------------------------------------
      # Frontend health check
      # ----------------------------------------------------------

      - name: Frontend health check
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 3 \
            http://127.0.0.1:8080

      # ----------------------------------------------------------
      # Deployment diagnostics
      # ----------------------------------------------------------

      - name: Deployment diagnostics
        if: always()
        run: |
          echo "========================================"
          echo "PODS"
          echo "========================================"

          kubectl get pods \
            -n pipelineshield \
            -o wide || true

          echo "========================================"
          echo "SERVICES"
          echo "========================================"

          kubectl get svc \
            -n pipelineshield || true

          echo "========================================"
          echo "DEPLOYMENTS"
          echo "========================================"

          kubectl get deployments \
            -n pipelineshield || true

          echo "========================================"
          echo "BACKEND LOGS"
          echo "========================================"

          kubectl logs \
            deployment/pipelineshield-backend \
            -n pipelineshield \
            --tail=100 || true

          echo "========================================"
          echo "FRONTEND LOGS"
          echo "========================================"

          kubectl logs \
            deployment/pipelineshield-frontend \
            -n pipelineshield \
            --tail=100 || true

          echo "========================================"
          echo "BACKEND PORT"
          echo "========================================"

          echo "http://127.0.0.1:8000"

          echo "========================================"
          echo "SWAGGER"
          echo "========================================"

          echo "http://127.0.0.1:8000/api/docs"

          echo "========================================"
          echo "FRONTEND"
          echo "========================================"

          echo "http://127.0.0.1:8080"

          echo "========================================"
          echo "BACKEND PORT-FORWARD LOG"
          echo "========================================"

          cat /tmp/backend.log || true

          echo "========================================"
          echo "FRONTEND PORT-FORWARD LOG"
          echo "========================================"

          cat /tmp/frontend.log || true
